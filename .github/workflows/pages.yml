name: Publish portfolio

on:
  push:
    branches: [main, redo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRE_REDO: 7d894c50c306c90cfbffb913645d5833a6d92c1b
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preserve the pre-redesign publication ref
        run: |
          current=$(git ls-remote --tags origin refs/tags/pre-redo | cut -f1)
          if [ -z "$current" ]; then
            git push origin "$PRE_REDO:refs/tags/pre-redo"
          else
            test "$current" = "$PRE_REDO"
          fi

  build:
    needs: baseline
    if: always() && (needs.baseline.result == 'success' || needs.baseline.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements-build.txt
          npm ci --ignore-scripts
      - name: Check game and saves
        run: node --test portfolio-source/game-journey.test.cjs portfolio-source/game-engine.test.cjs portfolio-source/game-save-recovery.test.cjs game-audio.test.cjs
      - name: Build and validate the site
        run: |
          python3 portfolio-source/prepare_release.py --use-archive-if-current
          npm run check -- --built
      - name: Upload Pages payload
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Upload the audited release archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-release-archive
          path: deploy.zip
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..6}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[].id' | grep -q .; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-release-archive
          path: released
      - name: Sync the archive to the published revision
        run: |
          mv released/deploy.zip deploy.zip
          git add deploy.zip
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync the verified Pages archive [skip ci]'
          git push origin HEAD:main
