name: Publish archived portfolio

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Validate the original Pages archive
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from shutil import copy2
          from zipfile import ZipFile
          import json
          import re
          
          archive = Path('deploy.zip')
          assert sha256(archive.read_bytes()).hexdigest() == 'a6591a6641c93dd64fd95ac40250ef3df03d3c6d7fa87d2870c76dadc5ef03eb'
          target = Path('_site')
          with ZipFile(archive) as bundle:
              release = json.loads(bundle.read('release.json'))
              assert release['siteRevision'] == '2026-11-19-capabilities-and-cathedral'
              bundle.extractall(target)
          
          resume = Path('resume.pdf')
          assert sha256(resume.read_bytes()).hexdigest() == release['resume']['sha256']
          name = release['resume']['file']
          copy2(resume, target / resume.name)
          copy2(resume, target / name)
          
          # Apply the same résumé link substitution as this archive's original publisher.
          pattern = re.compile(r"""(href=["'])([^"']*?)resume\.pdf(?:\?[^"']*)?(["'])""")
          for page in target.rglob('*.html'):
              if page.is_relative_to(target / 'game'):
                  continue
              contents = page.read_text(encoding='utf-8')
              page.write_text(pattern.sub(lambda match: match[1] + match[2] + name + match[3], contents), encoding='utf-8')
          PY
          python3 validate_site.py _site --published --pdf resume.pdf
          python3 portfolio-source/audit_release.py _site
      - uses: actions/upload-pages-artifact@v4
        id: artifact
        with:
          path: _site
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          for attempt in {1..6}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[].id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
