name: Publish portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify garden combat and save compatibility
        run: node --test portfolio-source/game-journey.test.cjs portfolio-source/game-engine.test.cjs portfolio-source/game-save-recovery.test.cjs game-audio.test.cjs portfolio-source/glass-dock.test.cjs portfolio-source/sprite.test.cjs portfolio-source/sprite-brain.test.cjs
      - name: Verify cleanup safeguards
        run: python3 -m unittest discover -s portfolio-source -p release_cleanup_test.py
      - name: Verify unified navigation shell
        run: |
          python3 -m unittest discover -s portfolio-source -p site_shell_test.py
          python3 -m unittest discover -s portfolio-source -p sprite_content_test.py
          python3 portfolio-source/optics/generate_field.py --check
          python3 -m unittest discover -s portfolio-source -p optics_test.py
      - name: Check current film cache
        id: film-cache
        run: echo "cached=$(python3 portfolio-source/film/cache_probe.py)" >> "$GITHUB_OUTPUT"
      - name: Install static build dependencies
        run: python3 -m pip install --disable-pip-version-check --retries 2 --timeout 30 Pillow numpy opencc-python-reimplemented
      - name: Install film renderer dependencies when needed
        if: steps.film-cache.outputs.cached != 'true'
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk libegl1 libgl1-mesa-dri
          python3 -m pip install moderngl glcontext contourpy
      - name: Build and validate the complete release
        run: python3 portfolio-source/prepare_release.py --preserve-game
      - name: Verify my repository cleanup and current-file integrity
        run: python3 portfolio-source/audit_repository.py
      - name: Prepare browser verification
        timeout-minutes: 10
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y fonts-noto-cjk
          mkdir -p /tmp/fonts
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc /tmp/fonts/
          npm install --prefix "$RUNNER_TEMP/portfolio-browser" playwright@1.62.1 @axe-core/playwright@4.14.0 @sparticuz/chromium@153.0.0
          export CHROME_HELPER="$RUNNER_TEMP/portfolio-browser/node_modules/@sparticuz/chromium/build/index.js"
          export CHROME_PATH=$(node --input-type=module -e 'const {default:c}=await import(process.env.CHROME_HELPER); console.log(await c.executablePath())')
          echo "CHROME_HELPER=$CHROME_HELPER" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/portfolio-browser/node_modules" >> "$GITHUB_ENV"
      - name: Verify portfolio experience once
        timeout-minutes: 8
        run: AUDIT_ACCESSIBILITY=1 AUDIT_OUTPUT="$RUNNER_TEMP/portfolio-review" node portfolio-source/experience-release.browser.test.cjs _site
      - name: Save temporary visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-ui-review
          path: ${{ runner.temp }}/portfolio-review
          retention-days: 1


  deploy:
    if: github.event_name != 'pull_request'
    outputs:
      cleanup_authorized: ${{ steps.retire-authorization.outputs.enabled }}
      published_head: ${{ steps.archive.outputs.sha }}
    timeout-minutes: 55
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read one-time cleanup authorization
        id: retire-authorization
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'portfolio-source')
          from prepare_release import REVISION
          marker = Path('.github/retire-history-once.json')
          enabled = marker.exists()
          if enabled and json.loads(marker.read_text()) != {'siteRevision': REVISION, 'branch': 'main'}:
              raise SystemExit('Cleanup authorization does not match the release.')
          print('enabled=' + str(enabled).lower())
          PYCODE
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify garden combat and save compatibility
        run: node --test portfolio-source/game-journey.test.cjs portfolio-source/game-engine.test.cjs portfolio-source/game-save-recovery.test.cjs game-audio.test.cjs portfolio-source/glass-dock.test.cjs portfolio-source/sprite.test.cjs portfolio-source/sprite-brain.test.cjs
      - name: Verify cleanup safeguards
        run: python3 -m unittest discover -s portfolio-source -p release_cleanup_test.py
      - name: Verify unified navigation shell
        run: |
          python3 -m unittest discover -s portfolio-source -p site_shell_test.py
          python3 -m unittest discover -s portfolio-source -p sprite_content_test.py
          python3 portfolio-source/optics/generate_field.py --check
          python3 -m unittest discover -s portfolio-source -p optics_test.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check current film cache
        id: film-cache
        run: echo "cached=$(python3 portfolio-source/film/cache_probe.py)" >> "$GITHUB_OUTPUT"
      - name: Install static build dependencies
        run: python3 -m pip install --disable-pip-version-check --retries 2 --timeout 30 Pillow numpy opencc-python-reimplemented
      - name: Install film renderer dependencies when needed
        if: steps.film-cache.outputs.cached != 'true'
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk libegl1 libgl1-mesa-dri
          python3 -m pip install moderngl glcontext contourpy
      - name: Build and validate the complete release
        run: python3 portfolio-source/prepare_release.py --preserve-game
      - name: Verify my repository cleanup and current-file integrity
        run: python3 portfolio-source/audit_repository.py
      - name: Prepare browser verification
        timeout-minutes: 10
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y fonts-noto-cjk
          mkdir -p /tmp/fonts
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc /tmp/fonts/
          npm install --prefix "$RUNNER_TEMP/portfolio-browser" playwright@1.62.1 @axe-core/playwright@4.14.0 @sparticuz/chromium@153.0.0
          export CHROME_HELPER="$RUNNER_TEMP/portfolio-browser/node_modules/@sparticuz/chromium/build/index.js"
          export CHROME_PATH=$(node --input-type=module -e 'const {default:c}=await import(process.env.CHROME_HELPER); console.log(await c.executablePath())')
          echo "CHROME_HELPER=$CHROME_HELPER" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/portfolio-browser/node_modules" >> "$GITHUB_ENV"
      - name: Verify portfolio experience once
        timeout-minutes: 8
        run: AUDIT_ACCESSIBILITY=1 AUDIT_OUTPUT="$RUNNER_TEMP/portfolio-review" node portfolio-source/experience-release.browser.test.cjs _site
      - name: Save temporary visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: ${{ runner.temp }}/portfolio-review
          retention-days: 1
      - name: Keep the current publish archive in sync
        id: archive
        run: |
          if ! git diff --quiet -- deploy.zip portfolio-source/film/timeline.json portfolio-source/film/provenance.json; then
            git config user.name "马嘉程"
            git config user.email "majiacheng619@gmail.com"
            git add deploy.zip portfolio-source/film/timeline.json portfolio-source/film/provenance.json
            git commit -m "我的网站与24秒作品影片"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    if: needs.deploy.outputs.cleanup_authorized == 'true'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      deployments: write
    steps:
      - name: Checkout the current published source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Verify publication and retire obsolete records
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
          DEPLOYED_SHA: ${{ github.sha }}
          EXPECTED_HEAD: ${{ needs.deploy.outputs.published_head }}
        run: |
          git config user.name "马嘉程"
          git config user.email "majiacheng619@gmail.com"
          REVISION=$(python3 -c 'import sys; sys.path.insert(0,"portfolio-source"); from prepare_release import REVISION; print(REVISION)')
          python3 portfolio-source/release_cleanup.py --run-id "$CURRENT_RUN" --deployed-sha "$DEPLOYED_SHA" --site-revision "$REVISION" --expected-head "$EXPECTED_HEAD" --rewrite-main --apply --authorization-file .github/retire-history-once.json
