name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cleanup_history:
        description: 发布成功后清理旧记录与旧主线历史
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 55
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify garden combat and save compatibility
        run: node --test portfolio-source/game-engine.test.cjs portfolio-source/game-save-recovery.test.cjs game-audio.test.cjs
      - name: Verify visitor counting
        run: node --test visitor-service/*.test.mjs
      - name: Verify cleanup safeguards
        run: python3 -m unittest discover -s portfolio-source -p release_cleanup_test.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check current film cache
        id: film-cache
        run: echo "cached=$(python3 portfolio-source/film/cache_probe.py)" >> "$GITHUB_OUTPUT"
      - name: Install static build dependencies
        run: python3 -m pip install --disable-pip-version-check --retries 2 --timeout 30 Pillow numpy opencc-python-reimplemented
      - name: Install film renderer dependencies when needed
        if: steps.film-cache.outputs.cached != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk libegl1 libgl1-mesa-dri
          python3 -m pip install moderngl glcontext contourpy
      - name: Build and validate the complete release
        run: python3 portfolio-source/prepare_release.py
      - name: Verify my repository cleanup and current-file integrity
        run: python3 portfolio-source/audit_repository.py
      - name: Verify responsive pages and browser interactions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/portfolio-browser" playwright@1.62.1 @axe-core/playwright@4.14.0 @sparticuz/chromium@153.0.0
          export CHROME_HELPER="$RUNNER_TEMP/portfolio-browser/node_modules/@sparticuz/chromium/build/index.js"
          export CHROME_PATH=$(node --input-type=module -e 'const {default:c}=await import(process.env.CHROME_HELPER); console.log(await c.executablePath())')
          NODE_PATH="$RUNNER_TEMP/portfolio-browser/node_modules" node portfolio-source/game-browser-audit.cjs _site
          NODE_PATH="$RUNNER_TEMP/portfolio-browser/node_modules" node portfolio-source/game-cache-audit.cjs _site
          AUDIT_ACCESSIBILITY=1 AUDIT_OUTPUT="$RUNNER_TEMP/portfolio-review" NODE_PATH="$RUNNER_TEMP/portfolio-browser/node_modules" node portfolio-source/browser-audit.cjs _site
      - name: Save temporary visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: ${{ runner.temp }}/portfolio-review
          retention-days: 1
      - name: Keep the current publish archive in sync
        id: archive
        run: |
          if ! git diff --quiet -- deploy.zip portfolio-source/film/timeline.json portfolio-source/film/provenance.json || test -d portfolio-source/release-seed; then
            git config user.name "马嘉程"
            git config user.email "majiacheng619@gmail.com"
            git add deploy.zip portfolio-source/film/timeline.json portfolio-source/film/provenance.json
            if test -d portfolio-source/release-seed; then git rm -r portfolio-source/release-seed; fi
            git commit -m "发布当前网站与一分钟介绍影片"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    if: github.event_name == 'push' || inputs.cleanup_history
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      deployments: write
    steps:
      - name: Checkout the current published source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Verify publication and retire obsolete records
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          git config user.name "马嘉程"
          git config user.email "majiacheng619@gmail.com"
          python3 -c 'import os,sys; sys.path.insert(0,"portfolio-source"); from release_cleanup import verify_public; verify_public(os.environ["DEPLOYED_SHA"],"2026-10-18-editorial-premium")'
          python3 portfolio-source/release_cleanup.py --run-id "$CURRENT_RUN" --deployed-sha "$DEPLOYED_SHA" --site-revision "2026-10-18-editorial-premium" --rewrite-main --apply
