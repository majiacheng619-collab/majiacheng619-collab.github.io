name: Connect visitor analytics
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: visitor-backend
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VISITOR_ADMIN_TOKEN: ${{ secrets.VISITOR_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify analytics behavior
        run: node --test visitor-service/*.test.mjs
      - name: Deploy and verify visitor service
        run: python3 visitor-service/deploy.py
      - name: Publish verified endpoint configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "马嘉程"
          git config user.email "majiacheng619@gmail.com"
          git add portfolio-source/analytics-config.json
          if ! git diff --cached --quiet; then
            git commit -m "接通匿名访客统计服务"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN commits do not trigger a second push workflow.
          gh workflow run pages.yml --ref main -f cleanup_history=false
